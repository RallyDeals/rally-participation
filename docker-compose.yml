
services:
  participation-postgres:
    image: postgres:16
    container_name: participation-postgres
    environment:
      POSTGRES_DB: participation_db
      POSTGRES_USER: participation
      POSTGRES_PASSWORD: participation
    ports:
      - "5433:5432"
    volumes:
      - participation-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U participation -d participation_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rally-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # IMPORTANT:
      # Containers connect to Kafka using "kafka:9092"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  participation-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - maven_settings

    container_name: participation-service

    ports:
      - "8086:8086"

    environment:
      SERVER_PORT: 8086

      # Docker service name + internal PostgreSQL port
      DB_HOST: participation-postgres
      DB_PORT: 5432
      DB_NAME: participation_db
      DB_USER: participation
      DB_PASSWORD: participation

      # Docker service name + internal Kafka port
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # If your Deal Service runs on your HOST machine:
      RALLY_DEAL_SERVICE_BASE_URL: http://host.docker.internal:8085

    depends_on:
      participation-postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  loki:
    image: grafana/loki:2.9.8
    container_name: rally-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rally-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

volumes:
  participation-pg-data:

secrets:
  maven_settings:
    file: ${USERPROFILE}/.m2/settings.xml
