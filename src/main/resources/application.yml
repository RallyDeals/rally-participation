server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: participation-service
  profiles:
    active: real-deal-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:participation_db}
    username: ${DB_USER:participation}
    password: ${DB_PASSWORD:participation}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: participation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

rally:
  deal-service:
    base-url: ${RALLY_DEAL_SERVICE_BASE_URL:http://localhost:8085}
    timeout-ms: 2000
    retry:
      max-attempts: 2
      backoff-ms: 200
    stub:
      default-capacity: 5
      default-min-participants: 3
      default-end-time-days-from-now: 7
  participation:
    leave-cutoff-minutes: 10
  outbox:
    poll-interval-ms: 1000
    batch-size: 100
  kafka:
    topics:
      participation: participation
      order-deal-order-cancelled: order.deal_order_cancelled

logging:
  level:
    com.rally.participation: DEBUG
