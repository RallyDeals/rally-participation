server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: participation-service
  profiles:
    active: real-deal-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:participation_db}
    username: ${DB_USER:participation}
    password: ${DB_PASSWORD:participation}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: participation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id
      tag-fields: X-Correlation-Id
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

loki:
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
  enabled: ${LOKI_ENABLED:false}

rally:
  deal-service:
    base-url: ${RALLY_DEAL_SERVICE_BASE_URL:http://localhost:8085}
    timeout-ms: 2000
    retry:
      max-attempts: 2
      backoff-ms: 200
    stub:
      default-capacity: 5
      default-min-participants: 3
      default-end-time-days-from-now: 7
  participation:
    leave-cutoff-minutes: 10
  outbox:
    poll-interval-ms: 1000
    batch-size: 100
  kafka:
    topics:
      participation: participation
      order-events: order.lifecycle_events

logging:
  level:
    com.rally.participation: DEBUG
